<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <script src="iphone-model-finder-theme.js"></script>
  <title>iPhone Modell-Finder | Handy Notdienst Singen</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --bg-soft: #fbfbfd;
      --card: rgba(255, 255, 255, 0.88);
      --card-2: rgba(255, 255, 255, 0.96);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(15, 23, 42, 0.08);
      --accent: #0071e3;
      --accent-2: #4da3ff;
      --success: #148564;
      --warning: #b26a00;
      --danger: #b42318;
      --shadow: 0 18px 60px rgba(15, 23, 42, 0.07), 0 2px 10px rgba(15, 23, 42, 0.03);
      --radius: 28px;
      --radius-sm: 20px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #071521;
      --bg-soft: #0d2231;
      --card: rgba(18, 42, 58, 0.88);
      --card-2: rgba(11, 29, 42, 0.96);
      --text: #eef3f7;
      --muted: #b6c6d3;
      --line: rgba(255, 255, 255, 0.10);
      --accent: #65c7ff;
      --accent-2: #a9ddff;
      --success: #35d765;
      --warning: #f4b860;
      --danger: #ff8f86;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.34), 0 0 0 1px rgba(255,255,255,.03);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(0, 113, 227, 0.07), transparent 30%),
        linear-gradient(180deg, #fcfcfe 0%, #f5f5f7 42%, #eef2f6 100%);
      min-height: 100%;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at top center, rgba(101, 199, 255, 0.14), transparent 36%),
        radial-gradient(circle at 20% 20%, rgba(53, 215, 101, 0.08), transparent 34%),
        linear-gradient(180deg, #071521 0%, #0d2231 48%, #071521 100%);
    }

    body {
      padding: clamp(14px, 2vw, 28px);
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(18px, 2vw, 26px);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-badge {
      width: clamp(48px, 4vw, 56px);
      height: clamp(48px, 4vw, 56px);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #f1f3f6);
      display: grid;
      place-items: center;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.09);
      font-size: 26px;
      color: #111111;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .lang-switch {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
    }

    .lang-switch button,
    .secondary-btn,
    .ghost-btn,
    .cta,
    .option-btn,
    .path-btn {
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.22s cubic-bezier(.22,1,.36,1), background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, box-shadow 0.22s cubic-bezier(.22,1,.36,1), filter 0.22s ease;
      font: inherit;
    }

    .lang-switch button {
      padding: 9px 13px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      min-width: 60px;
      font-weight: 700;
    }

    .lang-switch button.active {
      background: #ffffff;
      border-color: rgba(0, 113, 227, 0.14);
      color: var(--text);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    @media (hover: hover) and (pointer: fine) {
      .lang-switch button:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .cta:hover,
      .option-btn:hover,
      .path-btn:hover {
        transform: translateY(-1px);
      }

      .path-btn:hover,
      .option-btn:hover,
      .color-option-btn:hover,
      .help-card:hover,
      .summary-card:hover,
      .result-box:hover,
      .lookup-box:hover,
      .tip-box:hover,
      .cta-box:hover,
      .photo-slot:hover {
        transform: translateY(-2px) scale(1.003);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.09);
      }

      .path-btn:hover::before,
      .option-btn:hover::before,
      .color-option-btn:hover::before,
      .cta:hover::before,
      .secondary-btn:hover::before,
      .ghost-btn:hover::before {
        opacity: 1;
        animation: sheenSweep 0.72s cubic-bezier(.22, 1, .36, 1) 1;
      }

      .photo-slot:hover img,
      .option-btn:hover .option-media img {
        transform: scale(1.028);
      }

      .color-option-btn:hover .color-dot,
      .color-option-btn:hover .color-icon-img {
        transform: scale(1.06);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      }
    }

    @media (hover: none), (pointer: coarse) {
      .path-btn:hover,
      .option-btn:hover,
      .color-option-btn:hover,
      .help-card:hover,
      .summary-card:hover,
      .result-box:hover,
      .lookup-box:hover,
      .tip-box:hover,
      .cta-box:hover,
      .photo-slot:hover,
      .lang-switch button:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .cta:hover {
        transform: none;
        box-shadow: inherit;
      }
    }

    
    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(320px, 0.78fr);
      gap: 24px;
      align-items: start;
    }

    .main-card,
    .side-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .main-card {
      padding: clamp(20px, 2.2vw, 34px);
      min-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .side-card {
      padding: clamp(18px, 1.8vw, 24px);
      position: sticky;
      top: 20px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .status-chip,
    .path-chip,
    .result-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .progressbar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
      margin-top: 12px;
    }

    .progressbar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: inherit;
      transition: width 0.46s cubic-bezier(.22,1,.36,1);
    }

    .eyebrow {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .screen-title {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0 0 12px;
    }

    .screen-subtitle {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.62;
      margin: 0 0 22px;
      max-width: 74ch;
    }

    .card-grid,
    .path-grid,
    .options-grid,
    .result-grid,
    .help-grid {
      display: grid;
      gap: 14px;
    }

    .path-grid,
    .options-grid,
    .help-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .path-btn,
    .option-btn,
    .help-card,
    .summary-card,
    .cta-box,
    .lookup-box,
    .tip-box,
    .photo-slot,
    .result-box {
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--card-2);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .path-btn {
      text-align: left;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(180deg, #ffffff, #fafbfd);
    }

    .path-btn strong,
    .option-btn strong {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
      letter-spacing: 0;
    }

    .path-btn span,
    .option-btn span,
    .help-card p,
    .summary-card p,
    .lookup-hint,
    .small-note,
    .tip-box p,
    .result-box p,
    .footer-note {
      color: var(--muted);
      line-height: 1.58;
      font-size: 14px;
    }

    .option-btn {
      padding: 16px;
      text-align: left;
      color: var(--text);
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-media {
      width: 100%;
      aspect-ratio: 3 / 2;
      min-height: 156px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: linear-gradient(180deg, #f5f7fb, #eef2f8);
      display: block;
      position: relative;
    }

    .option-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      box-sizing: border-box;
      padding: 10px;
    }

    .option-media-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.70);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
    }

    .option-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-copy strong {
      font-size: 16px;
      line-height: 1.3;
    }

    .option-caption {
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    .color-icon-img {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid rgba(15, 23, 42, 0.10);
      object-fit: cover;
      background: #fff;
      flex: 0 0 auto;
    }

    .option-btn.selected,
    .option-btn:hover,
    .path-btn:hover {
      border-color: rgba(0, 113, 227, 0.22);
      box-shadow: 0 16px 34px rgba(0, 113, 227, 0.08);
    }

    .color-question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .color-option-btn {
      text-align: left;
      padding: 18px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .color-option-btn:hover,
    .color-option-btn.selected {
      border-color: rgba(0, 113, 227, 0.28);
      box-shadow: 0 16px 34px rgba(0, 113, 227, 0.10);
      transform: translateY(-1px);
    }

    .color-option-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-option-dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid rgba(15, 23, 42, 0.10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
      flex: 0 0 auto;
    }

    .color-option-models {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .color-question-footer {
      margin-top: 18px;
    }

    .lookup-box,
    .cta-box,
    .tip-box,
    .result-box,
    .summary-card {
      padding: 18px;
    }

    .lookup-form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .lookup-input {
      flex: 1 1 320px;
      min-width: 0;
      max-width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #ffffff;
      color: var(--text);
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .lookup-input.compact-input {
      flex: 0 1 180px;
      max-width: 190px;
      padding: 13px 14px;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }

    .lookup-input:focus {
      border-color: rgba(0, 113, 227, 0.55);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.10);
    }

    .cta,
    .secondary-btn,
    .ghost-btn {
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 700;
    }

    .cta {
      background: linear-gradient(180deg, #0077ed, #0071e3);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(0, 113, 227, 0.22);
    }

    .secondary-btn {
      background: #ffffff;
      color: var(--text);
      border-color: rgba(15, 23, 42, 0.08);
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted);
      border-color: rgba(15, 23, 42, 0.1);
    }

    .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 22px;
    }

    .actions-row > * {
      flex: 1 1 220px;
    }

    .help-card {
      padding: 18px;
    }

    .help-card h3,
    .cta-box h3,
    .tip-box h3,
    .result-box h3,
    .summary-card h3,
    .side-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .steps-list,
    .result-list,
    .summary-list,
    .mini-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: var(--muted);
      line-height: 1.58;
      font-size: 14px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 22px 0;
    }

    .alert {
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
      line-height: 1.58;
      background: rgba(255, 255, 255, 0.78);
    }

    .alert.warning {
      background: rgba(255, 245, 230, 0.95);
      border-color: rgba(178, 106, 0, 0.18);
    }

    .alert.success {
      background: rgba(235, 251, 245, 0.96);
      border-color: rgba(20, 133, 100, 0.18);
    }

    .alert.danger {
      background: rgba(254, 242, 242, 0.96);
      border-color: rgba(180, 35, 24, 0.16);
    }

    .result-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 16px;
    }

    .result-chip.exact { color: var(--success); }
    .result-chip.likely { color: var(--warning); }
    .result-chip.family { color: var(--danger); }

    .model-name {
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0 0 12px;
    }

    .muted {
      color: var(--muted);
    }

    .hint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hint-gallery {
      display: grid;
      gap: 12px;
    }

    .photo-slot {
      overflow: hidden;
    }

    .photo-slot img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: contain;
      background: rgba(15, 23, 42, 0.04);
      box-sizing: border-box;
      padding: 10px;
    }

    .model-color-reference {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: contain;
      margin: 0 0 14px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    html[data-theme="dark"] .model-color-reference {
      background: rgba(255, 255, 255, 0.92);
    }

    .photo-slot .caption {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .photo-slot .caption strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .footer-note {
      margin-top: 16px;
    }

    .inline-code {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.08);
      font-size: 13px;
      color: var(--text);
    }

    @media (max-width: 1200px) {
      .panel {
        grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
      }
    }

    @media (max-width: 960px) {
      .panel { grid-template-columns: 1fr; }
      .side-card { position: static; order: 2; }
      .main-card { min-height: 0; }
      .path-grid,
      .options-grid,
      .help-grid,
      .color-question-grid,
      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
      }

      .brand {
        align-items: flex-start;
        gap: 12px;
      }

      .brand p {
        font-size: 13px;
      }

      .path-grid,
      .options-grid,
      .help-grid,
      .color-question-grid,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .screen-subtitle {
        font-size: 16px;
      }
    }

    @media (max-width: 560px) {
      .main-card, .side-card { padding: 18px; }
      .lookup-form { flex-direction: column; align-items: stretch; }
      .lookup-input.compact-input {
        max-width: 100%;
        flex: 1 1 auto;
        text-align: left;
        letter-spacing: 0.02em;
      }
      .cta, .secondary-btn, .ghost-btn { width: 100%; }
      .actions-row > * { flex-basis: 100%; }
      .brand h1 { font-size: 28px; }
      .option-btn,
      .path-btn,
      .color-option-btn {
        padding: 15px;
      }
      .option-media {
        aspect-ratio: 16 / 10;
        min-height: 132px;
      }
      .option-media-badge {
        left: 8px;
        top: 8px;
        font-size: 11px;
        padding: 6px 8px;
      }
    }


    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      filter: blur(48px);
      opacity: 0.22;
      will-change: transform;
    }

    body::before {
      width: 34vw;
      height: 34vw;
      min-width: 260px;
      min-height: 260px;
      left: -8vw;
      top: 6vh;
      background: radial-gradient(circle, rgba(0,113,227,0.26), transparent 68%);
      animation: floatGlowA 22s ease-in-out infinite;
    }

    body::after {
      width: 30vw;
      height: 30vw;
      min-width: 220px;
      min-height: 220px;
      right: -6vw;
      bottom: 12vh;
      background: radial-gradient(circle, rgba(77,163,255,0.20), transparent 70%);
      animation: floatGlowB 24s ease-in-out infinite;
    }

    .app-shell,
    .panel,
    .main-card,
    .side-card,
    #screen {
      position: relative;
      z-index: 1;
    }

    .main-card {
      overflow: hidden;
      isolation: isolate;
    }

    .main-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-120%);
      background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.06) 34%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0.08) 64%, transparent 100%);
      transition: opacity 0.2s ease;
    }

    .main-card.is-loading::after {
      opacity: 1;
      animation: loadingSheen 0.92s cubic-bezier(.22, 1, .36, 1) 1;
    }

    #screen {
      min-height: 420px;
    }

    .screen-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      contain: layout paint;
    }

    .screen-enter-forward {
      animation: screenEnterForward 0.42s cubic-bezier(.22, 1, .36, 1) both;
    }

    .screen-enter-backward {
      animation: screenEnterBackward 0.38s cubic-bezier(.22, 1, .36, 1) both;
    }
