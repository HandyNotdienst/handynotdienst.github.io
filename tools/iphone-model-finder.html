<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Modell-Finder | Handy Notdienst Singen</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --bg-soft: #fbfbfd;
      --card: rgba(255, 255, 255, 0.88);
      --card-2: rgba(255, 255, 255, 0.96);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(15, 23, 42, 0.08);
      --accent: #0071e3;
      --accent-2: #4da3ff;
      --success: #148564;
      --warning: #b26a00;
      --danger: #b42318;
      --shadow: 0 18px 60px rgba(15, 23, 42, 0.07), 0 2px 10px rgba(15, 23, 42, 0.03);
      --radius: 28px;
      --radius-sm: 20px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(0, 113, 227, 0.07), transparent 30%),
        linear-gradient(180deg, #fcfcfe 0%, #f5f5f7 42%, #eef2f6 100%);
      min-height: 100%;
    }

    body {
      padding: clamp(14px, 2vw, 28px);
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(18px, 2vw, 26px);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-badge {
      width: clamp(48px, 4vw, 56px);
      height: clamp(48px, 4vw, 56px);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #f1f3f6);
      display: grid;
      place-items: center;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.09);
      font-size: 26px;
      color: #111111;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .lang-switch {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
    }

    .lang-switch button,
    .secondary-btn,
    .ghost-btn,
    .cta,
    .option-btn,
    .path-btn {
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.22s cubic-bezier(.22,1,.36,1), background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, box-shadow 0.22s cubic-bezier(.22,1,.36,1), filter 0.22s ease;
      font: inherit;
    }

    .lang-switch button {
      padding: 9px 13px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      min-width: 60px;
      font-weight: 700;
    }

    .lang-switch button.active {
      background: #ffffff;
      border-color: rgba(0, 113, 227, 0.14);
      color: var(--text);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    @media (hover: hover) and (pointer: fine) {
      .lang-switch button:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .cta:hover,
      .option-btn:hover,
      .path-btn:hover {
        transform: translateY(-1px);
      }

      .path-btn:hover,
      .option-btn:hover,
      .color-option-btn:hover,
      .help-card:hover,
      .summary-card:hover,
      .result-box:hover,
      .lookup-box:hover,
      .tip-box:hover,
      .cta-box:hover,
      .photo-slot:hover {
        transform: translateY(-2px) scale(1.003);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.09);
      }

      .path-btn:hover::before,
      .option-btn:hover::before,
      .color-option-btn:hover::before,
      .cta:hover::before,
      .secondary-btn:hover::before,
      .ghost-btn:hover::before {
        opacity: 1;
        animation: sheenSweep 0.72s cubic-bezier(.22, 1, .36, 1) 1;
      }

      .photo-slot:hover img,
      .option-btn:hover .option-media img {
        transform: scale(1.028);
      }

      .color-option-btn:hover .color-dot,
      .color-option-btn:hover .color-icon-img {
        transform: scale(1.06);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      }
    }

    @media (hover: none), (pointer: coarse) {
      .path-btn:hover,
      .option-btn:hover,
      .color-option-btn:hover,
      .help-card:hover,
      .summary-card:hover,
      .result-box:hover,
      .lookup-box:hover,
      .tip-box:hover,
      .cta-box:hover,
      .photo-slot:hover,
      .lang-switch button:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .cta:hover {
        transform: none;
        box-shadow: inherit;
      }
    }

    
    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(320px, 0.78fr);
      gap: 24px;
      align-items: start;
    }

    .main-card,
    .side-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .main-card {
      padding: clamp(20px, 2.2vw, 34px);
      min-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .side-card {
      padding: clamp(18px, 1.8vw, 24px);
      position: sticky;
      top: 20px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .status-chip,
    .path-chip,
    .result-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .progressbar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
      margin-top: 12px;
    }

    .progressbar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: inherit;
      transition: width 0.46s cubic-bezier(.22,1,.36,1);
    }

    .eyebrow {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .screen-title {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0 0 12px;
    }

    .screen-subtitle {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.62;
      margin: 0 0 22px;
      max-width: 74ch;
    }

    .card-grid,
    .path-grid,
    .options-grid,
    .result-grid,
    .help-grid {
      display: grid;
      gap: 14px;
    }

    .path-grid,
    .options-grid,
    .help-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .path-btn,
    .option-btn,
    .help-card,
    .summary-card,
    .cta-box,
    .lookup-box,
    .tip-box,
    .photo-slot,
    .result-box {
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--card-2);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .path-btn {
      text-align: left;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(180deg, #ffffff, #fafbfd);
    }

    .path-btn strong,
    .option-btn strong {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
      letter-spacing: 0;
    }

    .path-btn span,
    .option-btn span,
    .help-card p,
    .summary-card p,
    .lookup-hint,
    .small-note,
    .tip-box p,
    .result-box p,
    .footer-note {
      color: var(--muted);
      line-height: 1.58;
      font-size: 14px;
    }

    .option-btn {
      padding: 16px;
      text-align: left;
      color: var(--text);
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-media {
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 156px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: linear-gradient(180deg, #f5f7fb, #eef2f8);
      display: block;
      position: relative;
    }

    .option-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      box-sizing: border-box;
      padding: 10px;
    }

    .option-media-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.70);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
    }

    .option-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-copy strong {
      font-size: 16px;
      line-height: 1.3;
    }

    .option-caption {
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    .color-icon-img {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid rgba(15, 23, 42, 0.10);
      object-fit: cover;
      background: #fff;
      flex: 0 0 auto;
    }

    .option-btn.selected,
    .option-btn:hover,
    .path-btn:hover {
      border-color: rgba(0, 113, 227, 0.22);
      box-shadow: 0 16px 34px rgba(0, 113, 227, 0.08);
    }

    .color-question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .color-option-btn {
      text-align: left;
      padding: 18px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .color-option-btn:hover,
    .color-option-btn.selected {
      border-color: rgba(0, 113, 227, 0.28);
      box-shadow: 0 16px 34px rgba(0, 113, 227, 0.10);
      transform: translateY(-1px);
    }

    .color-option-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-option-dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid rgba(15, 23, 42, 0.10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
      flex: 0 0 auto;
    }

    .color-option-models {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .color-question-footer {
      margin-top: 18px;
    }

    .lookup-box,
    .cta-box,
    .tip-box,
    .result-box,
    .summary-card {
      padding: 18px;
    }

    .lookup-form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .lookup-input {
      flex: 1 1 320px;
      min-width: 0;
      max-width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #ffffff;
      color: var(--text);
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .lookup-input.compact-input {
      flex: 0 1 180px;
      max-width: 190px;
      padding: 13px 14px;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }

    .lookup-input:focus {
      border-color: rgba(0, 113, 227, 0.55);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.10);
    }

    .cta,
    .secondary-btn,
    .ghost-btn {
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 700;
    }

    .cta {
      background: linear-gradient(180deg, #0077ed, #0071e3);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(0, 113, 227, 0.22);
    }

    .secondary-btn {
      background: #ffffff;
      color: var(--text);
      border-color: rgba(15, 23, 42, 0.08);
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted);
      border-color: rgba(15, 23, 42, 0.1);
    }

    .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 22px;
    }

    .actions-row > * {
      flex: 1 1 220px;
    }

    .help-card {
      padding: 18px;
    }

    .help-card h3,
    .cta-box h3,
    .tip-box h3,
    .result-box h3,
    .summary-card h3,
    .side-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .steps-list,
    .result-list,
    .summary-list,
    .mini-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: var(--muted);
      line-height: 1.58;
      font-size: 14px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 22px 0;
    }

    .alert {
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
      line-height: 1.58;
      background: rgba(255, 255, 255, 0.78);
    }

    .alert.warning {
      background: rgba(255, 245, 230, 0.95);
      border-color: rgba(178, 106, 0, 0.18);
    }

    .alert.success {
      background: rgba(235, 251, 245, 0.96);
      border-color: rgba(20, 133, 100, 0.18);
    }

    .alert.danger {
      background: rgba(254, 242, 242, 0.96);
      border-color: rgba(180, 35, 24, 0.16);
    }

    .result-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 16px;
    }

    .result-chip.exact { color: var(--success); }
    .result-chip.likely { color: var(--warning); }
    .result-chip.family { color: var(--danger); }

    .model-name {
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0 0 12px;
    }

    .muted {
      color: var(--muted);
    }

    .hint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hint-gallery {
      display: grid;
      gap: 12px;
    }

    .photo-slot {
      overflow: hidden;
    }

    .photo-slot img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: contain;
      background: rgba(15, 23, 42, 0.04);
      box-sizing: border-box;
      padding: 10px;
    }

    .photo-slot .caption {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .photo-slot .caption strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .footer-note {
      margin-top: 16px;
    }

    .inline-code {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.08);
      font-size: 13px;
      color: var(--text);
    }

    @media (max-width: 1200px) {
      .panel {
        grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
      }
    }

    @media (max-width: 960px) {
      .panel { grid-template-columns: 1fr; }
      .side-card { position: static; order: 2; }
      .main-card { min-height: 0; }
      .path-grid,
      .options-grid,
      .help-grid,
      .color-question-grid,
      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
      }

      .brand {
        align-items: flex-start;
        gap: 12px;
      }

      .brand p {
        font-size: 13px;
      }

      .path-grid,
      .options-grid,
      .help-grid,
      .color-question-grid,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .screen-subtitle {
        font-size: 16px;
      }
    }

    @media (max-width: 560px) {
      .main-card, .side-card { padding: 18px; }
      .lookup-form { flex-direction: column; align-items: stretch; }
      .lookup-input.compact-input {
        max-width: 100%;
        flex: 1 1 auto;
        text-align: left;
        letter-spacing: 0.02em;
      }
      .cta, .secondary-btn, .ghost-btn { width: 100%; }
      .actions-row > * { flex-basis: 100%; }
      .brand h1 { font-size: 28px; }
      .option-btn,
      .path-btn,
      .color-option-btn {
        padding: 15px;
      }
      .option-media {
        aspect-ratio: 16 / 10;
        min-height: 132px;
      }
      .option-media-badge {
        left: 8px;
        top: 8px;
        font-size: 11px;
        padding: 6px 8px;
      }
    }


    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      filter: blur(48px);
      opacity: 0.22;
      will-change: transform;
    }

    body::before {
      width: 34vw;
      height: 34vw;
      min-width: 260px;
      min-height: 260px;
      left: -8vw;
      top: 6vh;
      background: radial-gradient(circle, rgba(0,113,227,0.26), transparent 68%);
      animation: floatGlowA 22s ease-in-out infinite;
    }

    body::after {
      width: 30vw;
      height: 30vw;
      min-width: 220px;
      min-height: 220px;
      right: -6vw;
      bottom: 12vh;
      background: radial-gradient(circle, rgba(77,163,255,0.20), transparent 70%);
      animation: floatGlowB 24s ease-in-out infinite;
    }

    .app-shell,
    .panel,
    .main-card,
    .side-card,
    #screen {
      position: relative;
      z-index: 1;
    }

    .main-card {
      overflow: hidden;
      isolation: isolate;
    }

    .main-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-120%);
      background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.06) 34%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0.08) 64%, transparent 100%);
      transition: opacity 0.2s ease;
    }

    .main-card.is-loading::after {
      opacity: 1;
      animation: loadingSheen 0.92s cubic-bezier(.22, 1, .36, 1) 1;
    }

    #screen {
      min-height: 420px;
    }

    .screen-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      contain: layout paint;
    }

    .screen-enter-forward {
      animation: screenEnterForward 0.42s cubic-bezier(.22, 1, .36, 1) both;
    }

    .screen-enter-backward {
      animation: screenEnterBackward 0.38s cubic-bezier(.22, 1, .36, 1) both;
    }

    .screen-exit-forward {
      animation: screenExitForward 0.18s cubic-bezier(.4, 0, 1, 1) both;
      pointer-events: none;
    }

    .screen-exit-backward {
      animation: screenExitBackward 0.18s cubic-bezier(.4, 0, 1, 1) both;
      pointer-events: none;
    }

    .stagger-item {
      opacity: 0;
      transform: translateY(16px) scale(0.988);
      animation: itemReveal 0.5s cubic-bezier(.22, 1, .36, 1) forwards;
      animation-delay: var(--stagger-delay, 0ms);
      will-change: transform, opacity;
    }

    .screen-title.stagger-item,
    .model-name.stagger-item {
      transform: translateY(22px) scale(0.985);
      animation-duration: 0.56s;
    }

    .result-chip.stagger-item,
    .status-chip,
    .path-chip {
      backface-visibility: hidden;
    }

    .result-hero {
      animation: resultHeroIn 0.78s cubic-bezier(.18, 1, .32, 1) both;
    }

    .photo-slot,
    .option-media,
    .color-option-btn,
    .path-btn,
    .option-btn,
    .help-card,
    .summary-card,
    .result-box,
    .lookup-box,
    .tip-box,
    .cta-box,
    .alert {
      will-change: transform, box-shadow, opacity;
    }

    .path-btn,
    .option-btn,
    .color-option-btn,
    .cta,
    .secondary-btn,
    .ghost-btn,
    .lang-switch button {
      transform-origin: center center;

    function displayColorName(name) {
      return COLOR_NAME_KEYS[name] ? t(COLOR_NAME_KEYS[name]) : name;
    }

    function colorId(name) {
      return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }

    function getColorChoices(models) {
      const map = new Map();
      models.forEach(model => {
        (MODEL_DATA[model] || []).forEach(color => {
          const id = colorId(color.name);
          if (!map.has(id)) {
            map.set(id, { id, name: color.name, hex: color.hex, models: [model] });
          } else {
            const item = map.get(id);
            if (!item.models.includes(model)) item.models.push(model);
          }
        });
      });
      return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
    }

    function hasUsefulColorChoices(models) {
      if (!Array.isArray(models) || models.length <= 1) return false;
      const choices = getColorChoices(models);
      return choices.some(choice => choice.models.length < models.length);
    }

    function canAskColorQuestion(resultId) {
      const raw = RESULT_NODES[resultId];
      if (!raw || !Array.isArray(raw.models) || !raw.models.length) return false;
      if (!raw.models.every(model => Array.isArray(MODEL_DATA[model]) && MODEL_DATA[model].length > 0)) return false;
      return hasUsefulColorChoices(raw.models);
    }

    function wrapScreen(direction = "forward") {
      const existingWrap = screenEl.firstElementChild;
      if (existingWrap && existingWrap.classList.contains("screen-wrap") && screenEl.children.length === 1) {
        existingWrap.classList.add(direction === "backward" ? "screen-enter-backward" : "screen-enter-forward");
        return existingWrap;
      }
      const wrap = document.createElement("div");
      wrap.className = "screen-wrap " + (direction === "backward" ? "screen-enter-backward" : "screen-enter-forward");
      while (screenEl.firstChild) wrap.appendChild(screenEl.firstChild);
      screenEl.appendChild(wrap);
      return wrap;
    }

    function staggerElements(elements, step = 52, max = 360) {
      Array.from(elements || []).forEach((el, index) => {
        el.classList.add("stagger-item");
        el.style.setProperty("--stagger-delay", `${Math.min(index * step, max)}ms`);

    function setupImageLoadingEffects(root) {
      root.querySelectorAll(".photo-slot, .option-media").forEach(frame => frame.classList.add("loading"));
      root.querySelectorAll("img").forEach(img => {
        if (img.dataset.animBound === "1") return;
        img.dataset.animBound = "1";
        img.classList.add("img-loading");
        const frame = img.closest(".photo-slot, .option-media");
        const clear = () => {
          img.classList.remove("img-loading");
          if (frame) frame.classList.remove("loading");
        };
        if (img.complete) {
          requestAnimationFrame(clear);
        } else {
          img.addEventListener("load", clear, { once: true });
          img.addEventListener("error", clear, { once: true });
        }
      });

      if (currentWrap) {
        currentWrap.classList.remove("screen-enter-forward", "screen-enter-backward");
        currentWrap.classList.add(direction === "backward" ? "screen-exit-backward" : "screen-exit-forward");
      }
      const delay = currentWrap ? (options.delay || 170) : 0;
      window.setTimeout(() => {
        try {
          mutator();
        } finally {
          render(direction);
          window.setTimeout(() => { state.isTransitioning = false; }, 40);

    }

    function navigateChoice(triggerEl, mutator, direction = "forward") {

      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

    function normalizeModelToken(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");

    function makePlaceholderSvg(title, subtitle) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#223257"/>
              <stop offset="100%" stop-color="#18213d"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="750" rx="28" fill="url(#g)"/>
          <rect x="40" y="40" width="1120" height="670" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
          <circle cx="165" cy="145" r="54" fill="rgba(124,156,255,0.22)" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>
          <path d="M145 145h40M165 125v40" stroke="#dfe7ff" stroke-width="10" stroke-linecap="round"/>
          <text x="80" y="260" fill="#eef2ff" font-family="Arial, sans-serif" font-size="56" font-weight="700">${escapeXml(title)}</text>
          <text x="80" y="330" fill="#b7c0de" font-family="Arial, sans-serif" font-size="28">${escapeXml(subtitle)}</text>
          <text x="80" y="640" fill="rgba(255,255,255,0.35)" font-family="Arial, sans-serif" font-size="22">Nutze die Hinweise, um die Modellnummer sicher zu finden.</text>
        </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");

    function doLookup() {
      const rawInput = String(state.lookupValue || "").trim();
      const normalized = normalizeANumber(rawInput);

      if (state.screen === "box") {
        let model = null;
        let aNumber = null;

        if (/^A\d{4}$/.test(normalized) && A_NUMBER_MAP[normalized]) {
          model = A_NUMBER_MAP[normalized];
          aNumber = normalized;
        } else {
          model = lookupModelByName(rawInput);
        }

        if (!model) {
          state.feedback = t("noNumberFound");
          showLoadingPulse();
          render("forward");
          return;
        }

        pushHistory();
        transitionTo(() => {
          state.result = {
            kind: "exact",
            aNumber,
            source: "box",
            models: [model],
            level: "exact"
          };
          state.screen = "result";
          state.feedback = null;
        }, "forward", { loader: true, delay: 170 });
        return;
      }

      if (!/^A\d{4}$/.test(normalized)) {
        state.feedback = t("noNumberFound");
        showLoadingPulse();
        render("forward");
        return;
      }
      const model = A_NUMBER_MAP[normalized];
      if (!model) {
        state.feedback = t("noNumberFound");
        showLoadingPulse();
        render("forward");
        return;
      }
      pushHistory();
      transitionTo(() => {
        state.result = {
          kind: "exact",
          aNumber: normalized,
          source: state.screen,
          models: [model],
          level: "exact"
        };
        state.screen = "result";
        state.feedback = null;
      }, "forward", { loader: true, delay: 170 });
    }

    function answerNode(value, triggerEl = null) {
      const node = QUESTION_NODES[state.nodeId];
      if (!node) return;
      pushHistory();
      transitionTo(() => {
        state.answers[state.nodeId] = value;
        const nextNodeId = node.next[value];
        if (RESULT_NODES[nextNodeId]) {
          state.pendingResultId = nextNodeId;
          state.pendingModels = RESULT_NODES[nextNodeId].models.slice();
          state.selectedColorName = null;
          state.selectedColorNarrowed = false;
          if (canAskColorQuestion(nextNodeId)) {
            state.screen = "colorQuestion";
          } else {
            state.result = buildVisualResult(nextNodeId);
            state.screen = "result";
          }
          return;
        }
        state.nodeId = nextNodeId;
        state.screen = "visualQuestion";
      }, "forward", { triggerEl, loader: true, delay: 180 });
    }

    function buildVisualResult(resultId, overrideModels = null) {
      const raw = RESULT_NODES[resultId];
      const originalExterior = state.answers.originalExterior;
      const exactExterior = originalExterior === "yes";
      const models = overrideModels && overrideModels.length ? overrideModels : raw.models;
      const single = models.length === 1;
      const level = single ? "likely" : "family";
      return {
        kind: "visual",
        level,
        models,
        noteKey: raw.noteKey || null,
        resultId,
        selectedColorName: state.selectedColorName || null,
        colorFiltered: !!state.selectedColorNarrowed
      };
    }


    function renderColorQuestion() {
      const resultId = state.pendingResultId;
      const models = (state.pendingModels && state.pendingModels.length ? state.pendingModels : (RESULT_NODES[resultId]?.models || [])).slice();
      const choices = getColorChoices(models);
      if (!resultId || !choices.length || !hasUsefulColorChoices(models)) {
        state.result = buildVisualResult(resultId, models);
        state.pendingResultId = null;
        state.pendingModels = null;
        state.screen = "result";
        render();
        return;
      }

      renderHints(["original_exterior"]);
      const subtitle = models.length === 1 ? t("colorFinalSubtitleSingle") : t("colorFinalSubtitleFamily");
      const optionsHtml = choices.map(choice => `
        <button type="button" class="color-option-btn" data-color-id="${choice.id}">
          <div class="color-option-top">
            ${colorIconHtml(choice)}
            <div>
              <strong>${displayColorName(choice.name)}</strong>
              <span>${t("continueBtn")}</span>
            </div>
          </div>
          <div class="color-option-models">${choice.models.join(" · ")}</div>
        </button>
      `).join("");

      screenEl.innerHTML = `
        <div class="eyebrow">${t("resultColorQuestionTitle")}</div>
        <h2 class="screen-title">${t("colorFinalTitle")}</h2>
        <p class="screen-subtitle">${subtitle}</p>
        <div class="alert warning"><strong>${t("resultColorQuestionTitle")}</strong><br>${t("resultColorQuestionText")}</div>
        <div class="color-question-grid">${optionsHtml}</div>
        <div class="color-question-footer">
          <button type="button" class="option-btn" id="skipColorBtn">
            <strong>${t("colorSkip")}</strong>
            <span>${t("continueBtn")}</span>
          </button>
        </div>
        <div class="tip-box" style="margin-top:16px;">
          <h3>${t("colorNarrowedTitle")}</h3>
          <p>${t("colorFinalFooter")}</p>
        </div>
        <div class="actions-row">
          <button type="button" class="ghost-btn" id="backColorQuestion">${t("backBtn")}</button>
          <button type="button" class="secondary-btn" id="needExactFromColor">${t("goSettings")}</button>
          <button type="button" class="secondary-btn" id="restartFromColor">${t("startOverBtn")}</button>
        </div>
      `;

      screenEl.querySelectorAll(".color-option-btn").forEach(btn => {
        btn.onclick = () => {
          const choice = choices.find(item => item.id === btn.dataset.colorId);
          if (!choice) return;
          navigateChoice(btn, () => {
            state.selectedColorName = choice.name;
            state.selectedColorNarrowed = choice.models.length < models.length;
            state.result = buildVisualResult(resultId, choice.models.slice());
            state.pendingResultId = null;
            state.pendingModels = null;
            state.screen = "result";
          });
        };
      });

      document.getElementById("skipColorBtn").onclick = (event) => {
        navigateChoice(event.currentTarget, () => {
          state.selectedColorName = null;
          state.selectedColorNarrowed = false;
          state.result = buildVisualResult(resultId, models);
          state.pendingResultId = null;
          state.pendingModels = null;
          state.screen = "result";
        });
      };
      document.getElementById("backColorQuestion").onclick = restoreLast;
      document.getElementById("needExactFromColor").onclick = (event) => {
        pushHistory();
        navigateChoice(event.currentTarget, () => {
          state.screen = "settings";
          state.pendingResultId = null;
          state.pendingModels = null;
        }, "backward");
      };
      document.getElementById("restartFromColor").onclick = resetApp;
    }

    function renderVisualQuestion() {
      const nodeId = state.nodeId;
      const node = QUESTION_NODES[nodeId];
      if (!node) {
        resetApp();
        return;
      }
      renderHints(node.hints || []);
      const optionsHtml = node.options.map((opt, index) => {
        return `
          <button type="button" class="option-btn" data-value="${opt.value}">
            ${optionImageHtml(nodeId, node, opt, index)}
          </button>
        `;
      }).join("");

      screenEl.innerHTML = `
        <div class="eyebrow">${t("stepVisual")}</div>
        <h2 class="screen-title">${t(node.titleKey)}</h2>
        <p class="screen-subtitle">${t("questionCommonSubtitle")}</p>
        <div class="alert warning" style="margin-bottom:16px;">${t("originalWarningShort")}</div>

        <div class="options-grid">${optionsHtml}</div>

        <div class="actions-row">
          <button type="button" class="ghost-btn" id="backQuestion">${t("backBtn")}</button>
          <button type="button" class="secondary-btn" id="needExactNow">${t("goSettings")}</button>
          <button type="button" class="secondary-btn" id="resetFromQuestion">${t("startOverBtn")}</button>
        </div>
      `;

      screenEl.querySelectorAll(".option-btn").forEach(btn => {
        btn.onclick = () => answerNode(btn.dataset.value, btn);
      });
      document.getElementById("backQuestion").onclick = restoreLast;
      document.getElementById("needExactNow").onclick = (event) => {
        pushHistory();
        navigateChoice(event.currentTarget, () => {
          state.screen = "settings";
        }, "backward");
      };
      document.getElementById("resetFromQuestion").onclick = resetApp;
    }

    function getAnswerSummary() {
      const items = [];
      Object.entries(state.answers).forEach(([id, value]) => {
        const node = QUESTION_NODES[id];
        if (!node) return;
        const option = node.options.find(opt => opt.value === value);
        if (!option) return;
        items.push(`<li><strong>${t(node.titleKey)}</strong>: ${t(option.labelKey)}</li>`);
      });
      if (state.selectedColorName) {
        items.push(`<li><strong>${t("colorSelectedLabel")}</strong>: ${displayColorName(state.selectedColorName)}</li>`);
      }
      return items.length ? items.join("") : `<li>${t("summaryUnknown")}</li>`;
    }

    function renderResult() {
      const result = state.result;
      if (!result) {
        resetApp();
        return;
      }
      const models = result.models || [];
      const isExact = result.kind === "exact";
      const chipLabel = isExact ? t("exactLabel") : (result.level === "likely" ? t("likelyLabel") : t("familyLabel"));
      const chipClass = isExact ? "exact" : (result.level === "likely" ? "likely" : "family");
      const heading = isExact ? t("exactResultTitle") : t("visualResultTitle");
      const mainModelHtml = models.length === 1
        ? `<h2 class="model-name">${models[0]}</h2>`
        : `<h2 class="model-name">${t("resultModelFamilyTitle")}</h2><div class="result-grid">${models.map(m => `<div class="result-box"><h3>${m}</h3></div>`).join("")}</div>`;
      const topNote = isExact
        ? (result.aNumber
            ? `<div class="alert success">${t("exactResultText")}<br><span class="muted">${t("resultsNoteExact")} · <span class="inline-code">${result.aNumber}</span></span></div>`
            : `<div class="alert success">${t("exactResultByNameText")}</div>`)
        : result.level === "likely"
          ? `<div class="alert warning">${t("visualWarnText")}</div>`
          : `<div class="alert danger">${t("resultNextExact")}</div>`;

      const optionalExteriorAlert = (!isExact && state.answers.originalExterior && state.answers.originalExterior !== "yes")
        ? `<div class="alert warning">${t("cautionExterior")}</div>`
        : "";
      const colorAlert = result.selectedColorName ? `
        <div class="alert ${result.colorFiltered && result.models.length === 1 ? "success" : "warning"}">
          <strong>${t("colorSelectedLabel")}: ${displayColorName(result.selectedColorName)}</strong><br>
          ${result.colorFiltered && result.models.length === 1 ? t("resultColorFilterExact") : t("resultColorFilterFamily")}
        </div>
      ` : "";
      const optionalNote = result.noteKey ? `<div class="tip-box"><h3>${t("startTipTitle")}</h3><p>${t(result.noteKey)}</p></div>` : "";

      renderHints(isExact ? (state.lookupSource === "box" ? ["box_receipt", "retail_label"] : [state.lookupSource === "device" ? "sim_tray_lookup" : "settings_about", state.lookupSource === "device" ? "connector_lookup" : "settings_model_tap"]) : ["settings_about", "sim_tray_lookup", "connector_lookup"]);
      screenEl.innerHTML = `
        <div class="eyebrow">${heading}</div>
        <span class="result-chip ${chipClass}">${chipLabel}</span>
        ${mainModelHtml}
        ${topNote}
        ${optionalExteriorAlert}
        ${colorAlert}

        <div class="result-grid">
          <div class="summary-card">
            <h3>${t("resultWhyTitle")}</h3>
            <ul class="summary-list">${isExact ? (
              result.source === "box" && !result.aNumber ? `
                <li>${t("exactReasonBox1")}</li>
                <li>${t("exactReasonBox2")}</li>
                <li>${t("exactReasonBox3")}</li>
              ` : `
                <li>${t("exactReason1")}</li>
                <li>${t("exactReason2")}</li>
                <li>${t("exactReason3")}</li>
              `
            ) : getAnswerSummary()}</ul>
          </div>
          <div class="summary-card">
            <h3>${t("resultNextTitle")}</h3>
            <ul class="summary-list">
              <li>${t("resultNextExact")}</li>
              ${isExact ? `<li>${t("resultsNoteExact")}</li>` : ""}
            </ul>
          </div>
        </div>

        ${colorHtmlForModels(models)}
        ${optionalNote}

        <div class="actions-row">
          <button type="button" class="ghost-btn" id="resultBackBtn">${t("resultBack")}</button>
          <button type="button" class="secondary-btn" id="resultExactBtn">${t("resultGoExact")}</button>
          <button type="button" class="secondary-btn" id="resultLookupAnother">${t("lookupAnother")}</button>
          <button type="button" class="cta" id="resultRestartBtn">${t("resultRestart")}</button>
        </div>
      `;
      document.getElementById("resultBackBtn").onclick = restoreLast;
      document.getElementById("resultExactBtn").onclick = (event) => {
        pushHistory();
        navigateChoice(event.currentTarget, () => {
          state.screen = "settings";
          state.result = null;
        }, "backward");
      };
      document.getElementById("resultLookupAnother").onclick = (event) => {
        pushHistory();
        navigateChoice(event.currentTarget, () => {
          state.screen = state.lookupSource === "device" ? "device" : "settings";
          state.result = null;
          state.lookupValue = "";
          state.feedback = null;
        }, "backward");
      };
      document.getElementById("resultRestartBtn").onclick = resetApp;
    }

    function render(direction = state.transitionDirection || "forward") {
      state.transitionDirection = direction;
      setTopText();
      updateTopChips();
      if (state.screen === "start") renderStart();
      else if (state.screen === "settings") renderLookup("settings");
      else if (state.screen === "device") renderLookup("device");
      else if (state.screen === "box") renderLookup("box");
      else if (state.screen === "visualIntro") renderVisualIntro();
      else if (state.screen === "visualQuestion") renderVisualQuestion();
      else if (state.screen === "colorQuestion") renderColorQuestion();
      else if (state.screen === "result") renderResult();
      else renderStart();
      enhanceRenderedScreen(direction);
      sendHeightToParent();
    }

    function sendHeightToParent() {
      const shell = document.querySelector(".app-shell");
      const height = Math.ceil((shell?.getBoundingClientRect().height || 0) + 56);
      window.parent?.postMessage({ type: "iphone-model-quiz-height", height }, "*");
    }

    window.addEventListener("resize", sendHeightToParent);
    const heightObserver = new MutationObserver(() => sendHeightToParent());
    heightObserver.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
    document.querySelectorAll("[data-lang]").forEach(x => x.classList.toggle("active", x.dataset.lang === state.lang));
    render();
  </script>
</body>
</html>
